kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: portfolio-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Frontend NodePort
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # Alternative frontend port
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
