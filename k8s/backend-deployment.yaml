apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
    spec:
      containers:
        - name: portfolio-backend
          image: pratyushpandey/portfoliobackend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8070
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "@Pratyush123"
            - name: SERVER_PORT
              value: "8070"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/api"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:32525,http://frontend-service"
          readinessProbe:
            httpGet:
              path: /api/portfolio/health
              port: 8070
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/portfolio/health
              port: 8070
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: portfolio
spec:
  type: ClusterIP
  selector:
    app: portfolio-backend
  ports:
    - port: 8070
      targetPort: 8070
      protocol: TCP
